aid: bigtincan

name: Bigtincan

description: Bigtincan is an AI-powered sales enablement platform that helps customer-facing teams deliver personalized, measurable buying experiences,
  combining sales content management, training and coaching (sales readiness), buyer engagement analytics, digital sales rooms and CRM content
  sync. Its Hub Public API (pubapi.bigtincan.com) exposes REST operations for stories, channels, tabs, files, forms, groups, users, search and
  events. Bigtincan's own site states that Bigtincan and Showpad are now together building a combined revenue effectiveness solution, and its
  trust center is branded Showpad + Bigtincan.

