implementation_notes:
  - >-
    Every tool would inherit its input schema from the backing operation's
    parameters and request body — those ARE declared in the Swagger document.
    Output schemas cannot be inherited: not one operation declares a response
    schema, so a server implementation would have to pass responses through
    untyped.
  - >-
    Authorization is by Hub role, not by OAuth scope, so a least-privilege token
    cannot be minted. An implementation should gate the destructive and
    external-effect tools above rather than rely on the token.
  - >-
    There is no idempotency mechanism, so every write tool must be treated as
    at-most-once and retried only after a read-back.
