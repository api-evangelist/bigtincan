name: Bigtincan Hub MCP Server (candidate)
description: >-
  Bigtincan ships NO Model Context Protocol server. A search of the provider's
  site, the MCP ecosystem and the public registries found no hosted endpoint and
  no stdio package, and no /.well-known/ai-plugin.json exists on any Bigtincan
  host (all 404 on 2026-08-14). The tool list below is a CANDIDATE derived from
  the 69 operations of the published Swagger 2.0 document — it describes what a
  Bigtincan MCP server could expose, not anything that exists today.
deployment:
