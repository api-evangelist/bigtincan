pagination_caps:
  note: >-
    The one published throughput constraint in the contract is a pagination cap,
    not a rate limit — `limit` on the collection operations is documented as
    "Pagination: results per page. Max 100" with a default of 10.
  max_page_size: 100
  default_page_size: 10
