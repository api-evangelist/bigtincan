name: Bigtincan API Rate Limits
description: >-
  Bigtincan publishes NO rate limits for the Bigtincan Hub Public API, and the
  API returns no rate-limit headers. Neither the Swagger 2.0 document at
  https://pubapi.bigtincan.com/api/sandbox/swagger/public-api nor the interactive
  console at https://pubapi.bigtincan.com/doc/interactive/ states a limit, a
  window or an exhaustion status code, and no RateLimit-*, X-RateLimit-* or
  Retry-After header appeared on any live response observed on 2026-08-14. An
  agent integrating this API therefore has no runtime backpressure signal at all
  and must implement its own client-side pacing.
url: https://pubapi.bigtincan.com/doc/interactive/
limit_count: 0
limits: []
response_headers:
  documented: []
  observed: []
  note: >-
    Observed set on live 401 responses from https://pubapi.bigtincan.com/v1/user/me
    and /v1/settings: date, content-type, server, strict-transport-security,
    access-control-allow-origin, access-control-allow-credentials,
    access-control-allow-headers, access-control-expose-headers,
    x-frame-options, cache-control. No rate-limit header of any family is present.
exhaustion:
  status_code: undocumented
  note: >-
    No 429 is declared on any of the 69 operations, and the reusable `responses`
    block declares 400, 401, 403, 404, 422 and 503 only. If throttling exists it
    is presumably surfaced as a 503 (Service unavailable), but that response is
    referenced by zero operations, so this cannot be confirmed without
    credentials.
