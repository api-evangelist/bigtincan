  source: https://trust.bigtincan.com/
  note: >-
    The trust center is operated jointly as "Showpad + Bigtincan" and states the
    certifications are held by Showpad.
  certifications:
    - name: SOC 2 Type II
      status: maintained
      evidence: '"Showpad currently maintains ISO27001 and ISO27701 certificates as well as SOC 2 Type II reports"'
    - name: ISO/IEC 27001
      status: certified
      evidence: '"Showpad currently maintains ISO27001 and ISO27701 certificates"'
    - name: ISO/IEC 27701
      status: certified
      evidence: '"Showpad currently maintains ISO27001 and ISO27701 certificates"'
  controls:
    - Data at rest encrypted to AES-256
    - Data in transit encrypted to TLS 1.2 or higher
    - Single Sign-On supported
    - Least-privilege access granting
    - Annual information security program review
  policies_named:
